<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Popup keeps its own tiny inline stylesheet so the page never depends
         on an external CSS chunk (robust inside packed extensions). */
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --surface: #ffffff;
        --text: #1c2333;
        --muted: #5b6478;
        --border: #d9dde8;
        --accent: #6d28d9;
        --ok: #15803d;
        --warn: #b45309;
        --danger: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11161f;
          --surface: #1a212e;
          --text: #e8ecf4;
          --muted: #9aa5b8;
          --border: #33405a;
          --accent: #a78bfa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 420px; /* Made it a bit wider */
        height: 550px; /* Added a fixed height to make it lengthy */
        overflow-y: auto; /* Adds a scrollbar if your content gets taller than 550px */
        margin: 0;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      .wrap {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      .tag {
        color: var(--muted);
        font-size: 11px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .pill {
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
      }
      .pill.ok {
        color: var(--ok);
      }
      .pill.warn {
        color: var(--warn);
      }
      .pill.danger {
        color: var(--danger);
      }
      button.primary {
        background: linear-gradient(135deg, var(--accent), #0ea5e9);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 12px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button.primary:focus-visible {
        outline: 2px solid #0ea5e9;
        outline-offset: 2px;
      }
      ul.campaigns {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      li .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .note {
        color: var(--muted);
        font-size: 11px;
        margin: 0;
      }
      footer {
        color: var(--muted);
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
